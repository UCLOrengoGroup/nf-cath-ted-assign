name: "foldseek_processresults"
description: |
  Pick the best CATH hit for each query domain from Foldseek search results and
  classify it as a homologous superfamily (H), topology (T) or structural (N) match
keywords:
  - foldseek
  - cath
  - homology
  - protein structure
tools:
  - format_fs_output.py:
      description: |
        Script from the domain-annotation-pipeline that maps Foldseek hits to CATH
        superfamilies with fixed E-value, coverage and TM-score thresholds
      homepage: https://github.com/UCLOrengoGroup/domain-annotation-pipeline
      documentation: https://github.com/UCLOrengoGroup/domain-annotation-pipeline
      tool_dev_url: https://github.com/UCLOrengoGroup/domain-annotation-pipeline/blob/dev/foldseek/bin/format_fs_output.py
      licence:
        - "GPL-3.0"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'predicted_set1', chunk_id:0 ]`
    - m8:
        type: file
        description: |
          Foldseek results with the columns query, target, fident, evalue, qlen,
          tlen, qtmscore, ttmscore, qcov, tcov, grouped by query
        pattern: "*.m8"
        ontologies:
          - edam: http://edamontology.org/format_3475
  - cath_domain_list:
      type: file
      description: CATH domain list (e.g. CathDomainList.S95.v4.4.0) covering every target in the Foldseek database
      pattern: "CathDomainList*"
      ontologies: []
output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'predicted_set1', chunk_id:0 ]`
      - ${prefix}.foldseek_parsed_results.tsv:
          type: file
          description: |
            Best hit per query domain (query_id, target_id, evalue, tmscore, code,
            type, qcov, tcov), sorted after the header row. Domains with no hit
            above the thresholds are omitted.
          pattern: "*.foldseek_parsed_results.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - 'python3 --version | sed "s/Python //"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_click:
    - - ${task.process}:
          type: string
          description: The name of the process
      - click:
          type: string
          description: The name of the tool
      - 'python3 -c ''import importlib.metadata as m; print(m.version("click"))''':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - 'python3 --version | sed "s/Python //"':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - click:
          type: string
          description: The name of the tool
      - 'python3 -c ''import importlib.metadata as m; print(m.version("click"))''':
          type: eval
          description: The expression to obtain the version of the tool
